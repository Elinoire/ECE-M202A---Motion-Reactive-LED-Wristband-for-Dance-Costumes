[platformio]
default_envs = wireless

[env]
platform = nordicnrf52
board = nano33ble
framework = arduino
monitor_speed = 115200

; On-board classifier + LEDs + BLE (src/main.cpp and the headers next to it)
[env:wireless]
build_src_filter = +<*> -<train/>
lib_deps =
    arduino-libraries/Arduino_BMI270_BMM150
    arduino-libraries/ArduinoBLE

; Data logger (src/train/main.cpp)
[env:logger]
build_src_filter = -<*> +<train/main.cpp>
lib_deps =
    arduino-libraries/Arduino_BMI270_BMM150